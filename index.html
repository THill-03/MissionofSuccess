<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission of Success</title>
<meta name="description" content="A four-stage rocket simulator for kids. Design Jupi, launch it, watch what happens, then tweak it.">

<!-- Straight into the game. The page below is only ever seen if this is blocked. -->
<meta http-equiv="refresh" content="0; url=Mission%20of%20Success.html">
<link rel="canonical" href="Mission%20of%20Success.html">

<style>
  :root{--bg:#0b1020;--panel:#151c33;--ink:#eef3ff;--dim:#8fa0c8;
        --hot:#ff7a2f;--hot2:#ffc24a;--line:#2c3860}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--bg);color:var(--ink);
       font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
  .card{max-width:520px;text-align:center;background:var(--panel);
        border:3px solid var(--line);border-radius:20px;padding:34px 32px}
  h1{margin:0 0 4px;font-size:34px;letter-spacing:1.5px;
     background:linear-gradient(90deg,var(--hot2),var(--hot));
     -webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{margin:0 0 22px;font-size:12px;letter-spacing:2px;color:var(--dim)}
  p{color:var(--dim)}
  a.play{display:inline-block;margin:6px 0 4px;padding:15px 34px;
         font-size:20px;font-weight:bold;letter-spacing:2px;text-decoration:none;
         color:#2a1300;background:linear-gradient(180deg,var(--hot2),var(--hot));
         border-radius:14px;box-shadow:0 5px 0 #a63f0a}
  a.play:hover{filter:brightness(1.08)}
  a.alt{color:var(--dim);font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <h1>MISSION OF SUCCESS</h1>
    <p class="sub">FLY THE JUPI ROCKET</p>
    <p>Taking you to the launch pad&hellip;</p>
    <p><a class="play" href="Mission%20of%20Success.html">LAUNCH</a></p>
    <p><a class="alt" href="https://github.com/THill-03/MissionofSuccess">See how it works on GitHub</a></p>
  </div>
  <script>location.replace("Mission%20of%20Success.html");</script>
</body>
</html>
